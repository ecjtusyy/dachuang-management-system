<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>登录</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-box">
        <h2>大学生创新创业项目全过程管理系统</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            <p>
                <label>账号</label>
                <input type="text" name="username" required>
            </p>

            <p>
                <label>密码</label>
                <input type="password" name="password" required>
            </p>

            <button type="submit">登录</button>
        </form>

        <div class="tips">
            <p>学生账号：student01 / 123456</p>
            <p>教师账号：teacher01 / 123456</p>
            <p>管理员账号：admin01 / 123456</p>
        </div>
    </div>
</body>
</html>
